[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mechcalc"
version = "0.1.0"
description = "Verified mechanical engineering design calculations in plain Python"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["mechcalc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
